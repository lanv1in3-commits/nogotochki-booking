<!doctype html><html lang="ru"><meta charset="utf-8"><title>Услуги — Ноготочки</title><link rel="stylesheet" href="style.css"><body><header class="top"><div class="brand"><b>✦</b> Ноготочки</div><nav><a href="services.html">Услуги</a><a href="login.html">Войти</a></nav></header><main class="wrap"><div class="eyebrow">Онлайн-запись</div><h1>Выберите услугу</h1><p class="lead">Стоимость и длительность приходят из сервиса в момент открытия страницы.</p><section class="cards" id="services"><p>Загружаем услуги…</p></section></main><script>fetch('/api/services').then(r=>r.json()).then(items=>{services.innerHTML=items.map(x=>`<article class="card"><h2>${x.name}</h2><p>${x.description}</p><div class="price">${x.price.toLocaleString('ru-RU')} ₽</div><div class="meta">${x.duration_minutes} минут</div></article>`).join('')}).catch(()=>services.textContent='Не удалось загрузить услуги.')</script></body></html>
