<!doctype html><html lang="ru"><meta charset="utf-8"><title>Кабинет — Ноготочки</title><link rel="stylesheet" href="style.css"><body><header class="top"><div class="brand"><b>✦</b> Ноготочки</div><nav><a href="services.html">Услуги</a><a href="login.html" id="logout">Выйти</a></nav></header><main class="wrap"><div class="eyebrow">Личный кабинет</div><h1 id="title">Мои записи</h1><section class="panel" style="max-width:100%" id="content">Загружаем…</section></main><script>logout.onclick=()=>localStorage.clear();fetch('/api/cabinet/appointments',{headers:{Authorization:'Bearer '+localStorage.token}}).then(async r=>{let d=await r.json();if(!r.ok){location.href='login.html';return}title.textContent='Записи: '+d.client;content.innerHTML=d.appointments.length?d.appointments.map(x=>`<article class="booking"><div><b>${x.service_name}</b><div class="meta">${x.master_name} · ${x.appointment_date}, ${x.start_time}</div></div><div><b>${x.price.toLocaleString('ru-RU')} ₽</b><div class="meta">${x.status}</div></div></article>`).join(''):'<div class="empty">У вас пока нет записей. Выберите услугу и запишитесь в студию.</div>'})</script></body></html>
