<!doctype html><html lang="ru"><meta charset="utf-8"><title>Вход — Ноготочки</title><link rel="stylesheet" href="style.css"><body><header class="top"><div class="brand"><b>✦</b> Ноготочки</div><nav><a href="services.html">Услуги</a></nav></header><main class="panel"><div class="eyebrow">Личный кабинет</div><h1>Войти</h1><p class="lead">Демо-клиент: demo@nogotochki.ru</p><form id="form"><label class="field">Email</label><input id="email" type="email" value="demo@nogotochki.ru" required><label class="field">Пароль</label><input id="password" type="password" required><div id="error" class="error" role="alert"></div><button>Войти →</button></form></main><script>form.onsubmit=async e=>{e.preventDefault();error.style.display='none';let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});let data=await r.json();if(!r.ok){error.textContent=data.error;error.style.display='block';return}localStorage.token=data.token;localStorage.name=data.name;location.href='cabinet.html'}</script></body></html>
